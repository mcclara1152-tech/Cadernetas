<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderneta do Casal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f0e8;--cream2:#ede5d4;--cream3:#e4d9c4;--paper:#faf7f0;
  --ink:#2c2416;--ink2:#4a3d2a;--ink3:#7a6a52;--ink4:#a89880;
  --terracota:#b85c38;--terracota2:#d4785a;--terracota-dim:rgba(184,92,56,0.12);
  --moss:#5a7a52;--moss2:#7a9a6a;--moss-dim:rgba(90,122,82,0.12);
  --mustard:#c49a2a;--mustard2:#dab84a;--mustard-dim:rgba(196,154,42,0.15);
  --rose:#b87878;--rose-dim:rgba(184,120,120,0.12);
  --border:#c8b898;--border2:#a89878;--r:4px;--rs:3px;
}
[data-theme=dark]{
  --cream:#1a1612;--cream2:#242018;--cream3:#2e2a20;--paper:#141210;
  --ink:#f0ece4;--ink2:#d4cfc4;--ink3:#a09880;--ink4:#706858;
  --border:#3a3428;--border2:#4a4235;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Crimson Pro',Georgia,serif;font-size:16px;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;}

/* LOGIN */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;z-index:100;background:var(--paper);}
.login-frame{border:2px solid var(--border);border-radius:2px;padding:44px 48px;text-align:center;position:relative;background:var(--paper);max-width:380px;width:90%;box-shadow:0 2px 24px rgba(44,36,22,.08);}
.login-frame::before,.login-frame::after{content:'✦';position:absolute;color:var(--mustard);font-size:16px;opacity:.6;}
.login-frame::before{top:8px;left:12px;}
.login-frame::after{bottom:8px;right:12px;}
.login-eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--ink4);margin-bottom:8px;}
.login-title h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:var(--ink);line-height:1.1;}
.login-title h1 em{font-style:italic;color:var(--terracota);}
.login-sub{font-family:'IM Fell English',serif;font-style:italic;font-size:13px;color:var(--ink4);margin-top:6px;}
.orn-sm{display:block;text-align:center;color:var(--terracota);opacity:.35;margin:8px 0;font-size:12px;letter-spacing:4px;}
.login-cards{display:flex;gap:16px;margin-top:8px;}
.login-card{flex:1;border:1.5px solid var(--border);border-radius:var(--r);background:var(--cream2);padding:20px 16px;cursor:pointer;transition:all .25s;}
.login-card:hover{border-color:var(--terracota);transform:translateY(-2px);box-shadow:0 6px 20px rgba(44,36,22,.12);}
.lc-initial{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin:0 auto 10px;border:2px solid;}
.lc-initial.maria{background:var(--terracota-dim);color:var(--terracota);border-color:var(--terracota);}
.lc-initial.murilo{background:var(--moss-dim);color:var(--moss);border-color:var(--moss);}
.lc-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink2);text-align:center;}
.lc-hint{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;color:var(--ink4);text-align:center;margin-top:3px;}

/* APP */
#app{display:none;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--ink);position:sticky;top:0;z-index:50;border-bottom:3px solid var(--mustard);}
.topbar-brand{font-family:'Playfair Display',serif;font-size:17px;font-weight:900;color:var(--cream);letter-spacing:.5px;}
.topbar-brand em{font-style:italic;color:var(--mustard2);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.btn-theme{background:none;border:1px solid rgba(255,255,255,.2);border-radius:var(--rs);color:var(--mustard2);font-size:14px;padding:4px 8px;cursor:pointer;transition:all .2s;}
.btn-theme:hover{background:rgba(255,255,255,.08);}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 9px;border:1px solid rgba(255,255,255,.15);border-radius:var(--rs);transition:all .2s;}
.topbar-user:hover{background:rgba(255,255,255,.08);border-color:var(--mustard);}
.t-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:11px;font-weight:700;}
.t-av.maria{background:var(--terracota-dim);color:var(--terracota);border:1px solid var(--terracota);}
.t-av.murilo{background:var(--moss-dim);color:var(--moss);border:1px solid var(--moss);}
.t-name{font-size:14px;color:var(--cream2);}
.t-caret{color:var(--ink4);font-size:9px;}
.nav{display:flex;gap:0;padding:0 20px;background:var(--ink2);border-bottom:1px solid var(--border2);overflow-x:auto;}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{background:none;border:none;color:var(--ink4);padding:10px 14px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;position:relative;top:1px;}
.nav-btn:hover{color:var(--cream2);}
.nav-btn.active{color:var(--mustard2);border-bottom-color:var(--mustard2);}
.main{padding:18px;max-width:820px;margin:0 auto;}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--terracota);color:var(--paper);border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(184,92,56,.4);z-index:40;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.fab:hover{background:var(--terracota2);transform:scale(1.08);}

/* CYCLE ALERT */
.cycle-alert{background:var(--mustard-dim);border:1px solid var(--mustard);border-left:4px solid var(--mustard);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:var(--ink2);}

/* PAGE HEADER */
.page-header{text-align:center;padding:18px 0 14px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.page-header h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:var(--ink);line-height:1;}
.page-header h2 em{font-style:italic;color:var(--terracota);}
.page-header p{font-family:'IM Fell English',serif;font-style:italic;font-size:13px;color:var(--ink4);margin-top:4px;}

/* CARD */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 8px rgba(44,36,22,.06);position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--terracota),var(--mustard),var(--moss));border-radius:var(--r) var(--r) 0 0;opacity:.4;}
.card-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;}
.card-title small{font-size:11px;font-weight:400;color:var(--ink4);letter-spacing:1.5px;text-transform:uppercase;font-family:'Crimson Pro',serif;}

/* SUM GRID */
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px;}
.sum-tile{background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);padding:13px;position:relative;overflow:hidden;}
.sum-tile::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.sum-tile.green::after{background:var(--moss);}
.sum-tile.red::after{background:var(--terracota);}
.sum-tile.gold::after{background:var(--mustard);}
.sum-tile.rose::after{background:var(--rose);}
.sum-label{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;}
.sum-val{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
.sum-val.green{color:var(--moss);}
.sum-val.red{color:var(--terracota);}
.sum-val.gold{color:var(--mustard);}
.sum-val.rose{color:var(--rose);}
.sum-sub{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;color:var(--ink4);margin-top:3px;}

/* BALANCE */
.bal-box{background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:9px;}
.bal-label{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:2px;margin-bottom:9px;}
.bal-bar{height:6px;background:var(--cream3);border-radius:3px;overflow:hidden;margin-bottom:8px;border:1px solid var(--border);}
.bal-fill{height:100%;background:linear-gradient(90deg,var(--terracota),var(--mustard));border-radius:3px;transition:width .6s;}
.bal-names{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);}
.debt-box{padding:11px 13px;border-radius:var(--r);font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:var(--ink2);border:1px solid var(--terracota);border-left:4px solid var(--terracota);background:var(--terracota-dim);}
.debt-box.ok{border-color:var(--moss);border-left-color:var(--moss);background:var(--moss-dim);}

/* COMPARE CARD */
.compare-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.compare-row:last-child{border-bottom:none;}
.compare-cat{font-size:13px;color:var(--ink2);}
.compare-vals{display:flex;gap:12px;font-family:'Playfair Display',serif;font-size:13px;}
.compare-up{color:var(--terracota);}
.compare-down{color:var(--moss);}
.compare-same{color:var(--ink4);}

/* PROJECTION */
.proj-box{background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);padding:13px;}
.proj-label{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
.proj-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;}
.proj-detail{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--ink4);margin-top:4px;}

/* RECURRING BOX */
.recur-summary{display:flex;flex-direction:column;gap:6px;}
.recur-item{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);}
.recur-name{font-size:13px;color:var(--ink2);}
.recur-amt{font-family:'Playfair Display',serif;font-size:13px;color:var(--terracota);}
.recur-total{display:flex;justify-content:space-between;padding:10px 11px 0;border-top:1px solid var(--border);margin-top:6px;font-family:'Playfair Display',serif;font-size:14px;font-weight:700;}

/* CATEGORIES */
.cat-list{display:flex;flex-direction:column;gap:8px;}
.cat-item{display:flex;flex-direction:column;gap:4px;}
.cat-head{display:flex;justify-content:space-between;align-items:center;}
.cat-name{font-size:14px;color:var(--ink2);}
.cat-v{font-family:'Playfair Display',serif;font-size:12px;color:var(--ink3);}
.cat-bar-wrap{height:5px;background:var(--cream3);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.cat-bar-fill{height:100%;border-radius:3px;transition:width .5s;}
.cat-warn{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;margin-top:1px;}

/* CHART */
.chart-wrap{width:100%;overflow-x:auto;}
.chart-svg{display:block;width:100%;min-width:280px;}

/* TX */
.tx-list{display:flex;flex-direction:column;gap:6px;}
.tx-item{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);transition:all .2s;}
.tx-item:hover{border-color:var(--border2);background:var(--cream3);}
.tx-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;}
.tx-info{flex:1;min-width:0;}
.tx-desc{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:11px;color:var(--ink4);margin-top:1px;}
.tx-obs{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;color:var(--ink4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-amt{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;flex-shrink:0;}
.tx-amt.expense{color:var(--terracota);}
.tx-amt.income{color:var(--moss);}
.tx-actions{display:flex;gap:2px;flex-shrink:0;}
.tx-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 5px;border-radius:var(--rs);transition:all .2s;color:var(--ink4);}
.tx-btn:hover{background:var(--cream);}
.tx-btn.del:hover{color:var(--terracota);}
.tx-btn.edit:hover{color:var(--mustard);}
.tx-paid{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .2s;flex-shrink:0;}
.tx-paid.paid{background:var(--moss);border-color:var(--moss);color:var(--paper);}
.tx-paid:hover{border-color:var(--moss);}
.tag-recur{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--rose-dim);color:var(--rose);border:1px solid var(--rose);margin-left:4px;vertical-align:middle;letter-spacing:1px;text-transform:uppercase;}
.tag-conjunto{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--mustard-dim);color:var(--mustard);border:1px solid var(--mustard);margin-left:4px;vertical-align:middle;letter-spacing:1px;text-transform:uppercase;}
.tag-maria{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--terracota-dim);color:var(--terracota);border:1px solid var(--terracota);margin-left:4px;vertical-align:middle;letter-spacing:1px;text-transform:uppercase;}
.tag-murilo{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--moss-dim);color:var(--moss);border:1px solid var(--moss);margin-left:4px;vertical-align:middle;letter-spacing:1px;text-transform:uppercase;}
.nature-toggle{display:flex;gap:6px;margin-top:10px;}
.nature-btn{flex:1;padding:7px 4px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--cream2);color:var(--ink3);cursor:pointer;font-family:'Crimson Pro',serif;font-size:13px;transition:all .2s;text-align:center;}
.nature-btn.sel-maria{background:var(--terracota-dim);border-color:var(--terracota);color:var(--terracota);}
.nature-btn.sel-murilo{background:var(--moss-dim);border-color:var(--moss);color:var(--moss);}
.nature-btn.sel-conjunto{background:var(--mustard-dim);border-color:var(--mustard);color:var(--mustard);}
/* BOLO */
.bolo-box{background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:9px;}
.bolo-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink3);}
.bolo-row:last-child{border-bottom:none;padding-top:10px;font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);}
.bolo-val{font-family:'Playfair Display',serif;font-size:13px;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:2px;}
.field input,.field select,.field textarea{background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);color:var(--ink);padding:8px 10px;font-family:'Crimson Pro',serif;font-size:15px;outline:none;transition:border-color .2s;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--terracota);background:var(--paper);}
.field select option{background:var(--cream2);}
.type-toggle{display:flex;gap:7px;margin-bottom:13px;}
.type-btn{flex:1;padding:8px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--cream2);color:var(--ink3);cursor:pointer;font-family:'Crimson Pro',serif;font-size:14px;transition:all .2s;}
.type-btn.exp{background:var(--terracota-dim);border-color:var(--terracota);color:var(--terracota);}
.type-btn.inc{background:var(--moss-dim);border-color:var(--moss);color:var(--moss);}
.recur-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);margin-top:10px;cursor:pointer;font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:var(--ink3);}
.recur-row input[type=checkbox]{accent-color:var(--terracota);width:15px;height:15px;cursor:pointer;}
.btn-primary{width:100%;padding:10px;background:var(--terracota);color:var(--paper);border:none;border-radius:var(--rs);font-family:'Playfair Display',serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:13px;transition:all .2s;}
.btn-primary:hover{background:var(--terracota2);}
.btn-primary.saved{background:var(--moss);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{width:100%;padding:9px;background:none;border:1.5px solid var(--border);color:var(--ink3);border-radius:var(--rs);font-family:'Crimson Pro',serif;font-size:14px;cursor:pointer;margin-top:8px;transition:all .2s;}
.btn-secondary:hover{border-color:var(--ink3);}

/* CYCLE NOTE */
.cycle-note-box{background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);padding:13px;}
.cycle-note-lbl{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
.cycle-note-text{font-family:'IM Fell English',serif;font-style:italic;font-size:15px;color:var(--ink2);line-height:1.6;white-space:pre-wrap;}
.cycle-note-empty{font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:var(--ink4);}

/* FILTERS */
.filter-bar{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap;}
.fsel{background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);color:var(--ink3);padding:5px 8px;font-size:13px;font-family:'Crimson Pro',serif;outline:none;cursor:pointer;}
.fsel option{background:var(--cream2);}
.hist-summary{display:flex;justify-content:space-between;padding:11px 0 0;border-top:1px solid var(--border);margin-top:9px;font-size:13px;color:var(--ink4);}

/* SETTINGS */
.srow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.srow:last-child{border-bottom:none;}
.slabel{font-size:14px;color:var(--ink2);}
.sdesc{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--ink4);margin-top:2px;}
.sval{font-family:'Playfair Display',serif;font-size:14px;color:var(--mustard);}
.sinput{background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);color:var(--ink);padding:5px 8px;font-family:'Playfair Display',serif;font-size:14px;width:72px;text-align:right;outline:none;}
.sinput:focus{border-color:var(--terracota);}
.cat-mgr{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;}
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);}
.cat-row span{font-size:14px;color:var(--ink2);}
.btn-x{background:none;border:none;color:var(--ink4);cursor:pointer;font-size:15px;padding:1px 5px;border-radius:3px;transition:all .2s;}
.btn-x:hover{color:var(--terracota);background:var(--terracota-dim);}
.add-row{display:flex;gap:6px;}
.add-input{flex:1;background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);color:var(--ink);padding:6px 10px;font-size:14px;font-family:'Crimson Pro',serif;outline:none;}
.add-input:focus{border-color:var(--terracota);}
.btn-add{background:var(--mustard-dim);border:1.5px solid var(--mustard);color:var(--mustard);padding:6px 12px;border-radius:var(--rs);cursor:pointer;font-size:16px;transition:all .2s;}
.btn-add:hover{background:var(--mustard);color:var(--paper);}

/* GOALS */
.goal-list{display:flex;flex-direction:column;gap:12px;}
.goal-item{background:var(--cream2);border:1px solid var(--border);border-radius:var(--r);padding:15px;}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
.goal-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);}
.goal-target{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--ink4);margin-top:2px;}
.goal-pct{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.goal-bar-wrap{height:7px;background:var(--cream3);border-radius:4px;overflow:hidden;border:1px solid var(--border);margin-bottom:7px;}
.goal-bar-fill{height:100%;border-radius:4px;transition:width .6s;}
.goal-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink4);}
.goal-actions{display:flex;gap:6px;margin-top:10px;}
.btn-goal{background:none;border:1px solid var(--border);color:var(--ink3);padding:4px 11px;border-radius:var(--rs);font-family:'Crimson Pro',serif;font-size:13px;cursor:pointer;transition:all .2s;}
.btn-goal:hover{border-color:var(--mustard);color:var(--mustard);}
.btn-goal.del:hover{border-color:var(--terracota);color:var(--terracota);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,36,22,.6);z-index:200;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--r);padding:24px;max-width:400px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(44,36,22,.2);position:relative;}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--terracota),var(--mustard),var(--moss));border-radius:var(--r) var(--r) 0 0;}
.modal h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-bottom:16px;color:var(--ink);}
.modal .field{margin-bottom:10px;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn-primary,.modal-actions .btn-secondary{margin-top:0;}

/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.show{opacity:1;pointer-events:all;}
.drawer{position:fixed;top:0;right:0;height:100%;width:285px;background:var(--paper);border-left:2px solid var(--border);z-index:81;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.drawer.show{transform:translateX(0);}
.d-head{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--ink);}
.d-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:16px;font-weight:700;flex-shrink:0;}
.d-av.maria{background:var(--terracota-dim);color:var(--terracota);border:2px solid var(--terracota);}
.d-av.murilo{background:var(--moss-dim);color:var(--moss);border:2px solid var(--moss);}
.d-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--cream);}
.d-month{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--ink4);margin-top:2px;}
.d-close{background:none;border:none;color:var(--ink4);font-size:20px;cursor:pointer;padding:2px 6px;margin-left:auto;border-radius:3px;transition:all .2s;}
.d-close:hover{color:var(--cream);}
.d-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:7px;}
.dstat{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:var(--cream2);border:1px solid var(--border);border-radius:var(--rs);}
.dstat-lbl{font-size:11px;color:var(--ink4);text-transform:uppercase;letter-spacing:1.5px;}
.dstat-val{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;}
.dstat-val.red{color:var(--terracota);}
.dstat-val.green{color:var(--moss);}
.dstat-val.gold{color:var(--mustard);}
.d-sec{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:2.5px;margin-top:6px;}
.switch-btn{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--border);border-radius:var(--rs);background:var(--cream2);cursor:pointer;transition:all .2s;}
.switch-btn:hover{border-color:var(--terracota);}
.sw-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:11px;font-weight:700;}
.sw-av.maria{background:var(--terracota-dim);color:var(--terracota);border:1px solid var(--terracota);}
.sw-av.murilo{background:var(--moss-dim);color:var(--moss);border:1px solid var(--moss);}
.sw-name{font-size:14px;color:var(--ink2);}
.sw-hint{font-family:'IM Fell English',serif;font-style:italic;font-size:11px;color:var(--ink4);margin-top:1px;}
.d-foot{padding:13px 15px;border-top:1px solid var(--border);background:var(--cream2);}
.btn-logout{width:100%;padding:8px;background:none;border:1px solid var(--border);border-radius:var(--rs);color:var(--ink3);font-family:'Crimson Pro',serif;font-size:13px;cursor:pointer;transition:all .2s;}
.btn-logout:hover{border-color:var(--terracota);color:var(--terracota);background:var(--terracota-dim);}

/* MISC */
.empty{text-align:center;padding:36px 20px;font-family:'IM Fell English',serif;font-style:italic;font-size:15px;color:var(--ink4);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 18px;font-family:'Crimson Pro',serif;font-size:14px;color:var(--cream2);z-index:300;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:var(--moss);color:var(--moss2);}
.toast.err{border-color:var(--terracota);color:var(--terracota2);}

@media(max-width:600px){.form-grid{grid-template-columns:1fr;}.main{padding:13px;}.drawer{width:100%;}.login-frame{padding:32px 24px;}.topbar{padding:10px 16px;}.nav{padding:0 12px;}}

</div>
<div class="toast" id="toast"></div>

<script>
var SB_URL='https://xdvablpmrfxaomxzeeru.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkdmFibHBtcmZ4YW9teHplZXJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzk2NzMsImV4cCI6MjA5MzkxNTY3M30.PkcXa5Ey10V1e8AwcxX4Bi_EydKTvwq6GkeHx6kz158';

function sbApi(method,table,body,filter){
  var url=SB_URL+'/rest/v1/'+table+(filter||'');
  var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':'return=minimal'};
  var opts={method:method,headers:h};
  if(body) opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t);});return r.text().then(function(t){return t?JSON.parse(t):null;});});
}
function sbGet(t,f){return sbApi('GET',t,null,f);}
function sbPost(t,b){return sbApi('POST',t,b);}
function sbDel(t,id){return sbApi('DELETE',t,null,'?id=eq.'+id);}
function sbPatch(t,id,b){return sbApi('PATCH',t,b,'?id=eq.'+id);}

var USER=null,TX_TYPE='expense',TX_NATURE='conjunto',gid=10;
var PAGES=['dashboard','lancamento','historico','metas','config'];
var CFG={m:58,mu:42,cycle_start:1,cycle_name:'',dark:false};
var CATS=[{name:'Moradia',limit:0},{name:'Alimentação',limit:0},{name:'Transporte',limit:0},{name:'Saúde',limit:0},{name:'Lazer',limit:500},{name:'Educação',limit:0},{name:'Pets',limit:200},{name:'Outros',limit:0}];
var GOALS=[{id:1,name:'Viagem juntos',target:3000,saved:800,color:'var(--mustard)'},{id:2,name:'Fundo de emergência',target:10000,saved:3200,color:'var(--moss)'}];
var PAYMENTS=['Crédito Nubank','Crédito C6','Débito Itaú','Pix','Dinheiro'];

// ── UTILS ──
function fmt(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2});}
function fmtS(v){var n=Number(v);if(n>=1000)return 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k';return fmt(v);}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDateShort(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
var toastTimer=null;
function toast(msg,type){
  if(toastTimer)clearTimeout(toastTimer);
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+(type||'')+' show';
  toastTimer=setTimeout(function(){el.className='toast';toastTimer=null;},2200);
}
function catNames(){return CATS.map(function(c){return c.name;});}
function catLimit(name){var c=CATS.find(function(x){return x.name===name;});return c?c.limit:0;}
function showLoading(){document.getElementById('main').innerHTML='<div class="empty" style="padding:60px">— carregando —</div>';}
function errBox(msg){document.getElementById('main').innerHTML='<div class="card" style="border-left:4px solid var(--terracota);padding:20px"><div style="font-family:Playfair Display,serif;font-size:16px;margin-bottom:8px">Erro de conexão</div><div style="font-size:14px;color:var(--ink3)">'+msg+'</div></div>';}

// ── CYCLE ──
function curCycle(){
  var d=new Date();
  var day=d.getDate();
  var s=CFG.cycle_start||1;
  var startDate,endDate;
  if(day>=s){startDate=new Date(d.getFullYear(),d.getMonth(),s);endDate=new Date(d.getFullYear(),d.getMonth()+1,s-1);}
  else{startDate=new Date(d.getFullYear(),d.getMonth()-1,s);endDate=new Date(d.getFullYear(),d.getMonth(),s-1);}
  var now=new Date();now.setHours(0,0,0,0);
  var daysLeft=Math.max(0,Math.ceil((endDate-now)/(1000*60*60*24)));
  return{start:fmtDate(startDate),end:fmtDate(endDate),label:fmtDateShort(startDate)+' → '+fmtDateShort(endDate),daysLeft:daysLeft};
}
function lastCycles(n){
  var cycles=[];var d=new Date();var s=CFG.cycle_start||1;
  var curStart=d.getDate()>=s?new Date(d.getFullYear(),d.getMonth(),s):new Date(d.getFullYear(),d.getMonth()-1,s);
  for(var i=0;i<n;i++){
    var st=new Date(curStart.getFullYear(),curStart.getMonth()-i,curStart.getDate());
    var en=new Date(st.getFullYear(),st.getMonth()+1,st.getDate()-1);
    cycles.push({start:fmtDate(st),end:fmtDate(en),label:fmtDateShort(st)+' → '+fmtDateShort(en)});
  }
  return cycles;
}

// ── THEME ──
function toggleTheme(){
  CFG.dark=!CFG.dark;
  applyTheme();
  saveCFG('dark',CFG.dark?'1':'0');
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',CFG.dark?'dark':'');
  document.getElementById('theme-btn').textContent=CFG.dark?'🌙':'☀️';
}

// ── CONFIG ──
function loadCFG(){
  return sbGet('fin_settings').then(function(rows){
    if(!rows)return;
    rows.forEach(function(r){
      if(r.key==='split_m')CFG.m=Number(r.value);
      if(r.key==='split_mu')CFG.mu=Number(r.value);
      if(r.key==='cycle_start')CFG.cycle_start=Number(r.value);
      if(r.key==='cycle_name')CFG.cycle_name=r.value;
      if(r.key==='dark')CFG.dark=r.value==='1';
      if(r.key==='cats'){try{CATS=JSON.parse(r.value);}catch(e){}}
      if(r.key==='goals'){try{GOALS=JSON.parse(r.value);}catch(e){}}
      if(r.key==='payments'){try{PAYMENTS=JSON.parse(r.value);}catch(e){}}
    });
    applyTheme();
  }).catch(function(){});
}
function saveCFG(key,val){
  return sbGet('fin_settings','?key=eq.'+key).then(function(rows){
    if(rows&&rows.length)return sbPatch('fin_settings',rows[0].id,{value:String(val)});
    return sbPost('fin_settings',{key:key,value:String(val)});
  }).catch(function(){});
}

// ── FETCH ──
function fetchRows(start,end,type,user,cat){
  var f='?order=date.desc,created_at.desc';
  if(start)f+='&date=gte.'+start;
  if(end)f+='&date=lte.'+end;
  if(type)f+='&type=eq.'+type;
  if(user)f+='&user_name=eq.'+encodeURIComponent(user);
  if(cat)f+='&category=eq.'+encodeURIComponent(cat);
  return sbGet('fin_transactions',f).then(function(r){return r||[];});
}

// ── NAV ──
function goTo(page){
  document.querySelectorAll('.nav-btn').forEach(function(b,i){b.classList.toggle('active',PAGES[i]===page);});
  showLoading();
  // garante que CFG está carregado antes de renderizar
  var render=function(){
    if(page==='dashboard')renderDash();
    if(page==='lancamento')renderForm();
    if(page==='historico')renderHist();
    if(page==='metas')renderMetas();
    if(page==='config')renderCfg();
  };
  if(!USER){render();return;}
  // se CFG já foi carregado (cycle_start diferente do padrão ou já buscou), renderiza direto
  render();
}
function curPage(){var btns=document.querySelectorAll('.nav-btn');for(var i=0;i<btns.length;i++){if(btns[i].classList.contains('active'))return PAGES[i];}return 'dashboard';}

// ── DASHBOARD ──
function renderDash(){
  var cycle=curCycle();
  var alertHtml='';
  if(cycle.daysLeft<=3){
    var msg=cycle.daysLeft===0?'⏳ Hoje é o último dia do ciclo. Hora de fechar as contas!':
            '⏳ O ciclo termina em '+cycle.daysLeft+' dia'+(cycle.daysLeft>1?'s':'')+'. Hora de fechar as contas!';
    alertHtml='<div class="cycle-alert">'+msg+'</div>';
  }
  fetchRows(cycle.start,cycle.end).then(function(all){
    var exp=all.filter(function(t){return t.type==='expense';});
    var inc=all.filter(function(t){return t.type==='income';});
    var totExp=exp.reduce(function(s,t){return s+Number(t.amount);},0);
    var totInc=inc.reduce(function(s,t){return s+Number(t.amount);},0);
    var paidExp=exp.filter(function(t){return isPaid(t);}).reduce(function(s,t){return s+Number(t.amount);},0);
    var paidInc=inc.filter(function(t){return isPaid(t);}).reduce(function(s,t){return s+Number(t.amount);},0);
    var realBal=paidInc-paidExp;
    var pendExp=totExp-paidExp;
    var mExp=exp.filter(function(t){return t.nature==='Maria';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var muExp=exp.filter(function(t){return t.nature==='Murilo';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var myExp=exp.filter(function(t){return t.nature===USER;}).reduce(function(s,t){return s+Number(t.amount);},0);
    var cmap={};exp.forEach(function(t){cmap[t.category]=(cmap[t.category]||0)+Number(t.amount);});
    var carr=Object.keys(cmap).map(function(k){return{name:k,val:cmap[k],limit:catLimit(k)};}).sort(function(a,b){return b.val-a.val;});
    var maxC=carr.length?carr[0].val:1;
    var catHtml=carr.map(function(c){
      var pct=Math.round(c.val/maxC*100);
      var over=c.limit>0&&c.val>c.limit;
      var exact=c.limit>0&&c.val===c.limit;
      var near=c.limit>0&&c.val>=c.limit*0.8&&!over&&!exact;
      var color=over||exact?'var(--terracota)':near?'var(--mustard)':'var(--moss)';
      var restanteHtml='';
      if(c.limit>0){
        var restTxt=over?'⚠ Excedeu '+fmt(c.val-c.limit):exact?'⚠ Limite atingido':near?'Próximo do limite — '+fmt(c.limit-c.val)+' restante':fmt(c.limit-c.val)+' restante';
        var restColor=over||exact?'var(--terracota)':near?'var(--mustard)':'var(--ink4)';
        restanteHtml='<div class="cat-warn" style="color:'+restColor+'">'+restTxt+'</div>';
      }
      return '<div class="cat-item"><div class="cat-head"><span class="cat-name">'+c.name+'</span><span class="cat-v">'+fmt(c.val)+(c.limit>0?' / '+fmt(c.limit):'')+'</span></div><div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+restanteHtml+'</div>';
    }).join('');

    // Recorrentes do ciclo
    var recur=all.filter(function(t){return t.recurring&&t.type==='expense';});
    var recurTotal=recur.reduce(function(s,t){return s+Number(t.amount);},0);
    var recurHtml=recur.length?'<div class="recur-summary">'+recur.map(function(t){return '<div class="recur-item"><span class="recur-name">'+t.description+'</span><span class="recur-amt">−'+fmt(t.amount)+'</span></div>';}).join('')+'<div class="recur-total"><span>Total fixo comprometido</span><span style="color:var(--terracota)">−'+fmt(recurTotal)+'</span></div></div>':'<div class="empty" style="padding:16px">Nenhum recorrente cadastrado.</div>';

    // Projeção
    var projSaldo=totInc-totExp;

    // Nota do ciclo
    var noteKey='cycle_note_'+cycle.start;
    var noteHtml='<div class="cycle-note-box"><div class="cycle-note-lbl">Nota do ciclo</div><div id="cycle-note-display"></div><button class="btn-secondary" style="margin-top:8px" onclick="openCycleNote(\''+cycle.start+'\',\''+cycle.end+'\')">✎ Editar nota</button></div>';

    // Bolo conjunto
    var conjExp=exp.filter(function(t){return t.nature==='conjunto';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var mariaInd=exp.filter(function(t){return t.nature==='Maria';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var muriloInd=exp.filter(function(t){return t.nature==='Murilo';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var bolo=totInc-conjExp-mariaInd-muriloInd;
    var boloHtml='<div class="bolo-box">'+
      '<div class="bolo-row"><span>Renda total</span><span class="bolo-val" style="color:var(--moss)">+'+fmt(totInc)+'</span></div>'+
      '<div class="bolo-row"><span>Despesas conjuntas</span><span class="bolo-val" style="color:var(--terracota)">−'+fmt(conjExp)+'</span></div>'+
      '<div class="bolo-row"><span>Individuais Maria</span><span class="bolo-val" style="color:var(--terracota)">−'+fmt(mariaInd)+'</span></div>'+
      '<div class="bolo-row"><span>Individuais Murilo</span><span class="bolo-val" style="color:var(--terracota)">−'+fmt(muriloInd)+'</span></div>'+
      '<div class="bolo-row"><span>Bolo disponível</span><span class="bolo-val" style="color:'+(bolo>=0?'var(--moss)':'var(--terracota)')+'\">'+(bolo>=0?'+':'')+fmt(bolo)+'</span></div>'+
    '</div>';

    var cycleName=CFG.cycle_name?'<em> — '+CFG.cycle_name+'</em>':'';
    document.getElementById('main').innerHTML=
      alertHtml+
      '<div class="page-header"><div class="orn-sm">— ✿ —</div><h2>Ciclo <em>'+cycle.label+'</em>'+cycleName+'</h2><p>'+(cycle.daysLeft===0?'Último dia do ciclo':cycle.daysLeft+' dias restantes')+' · <span style="cursor:pointer;text-decoration:underline;color:var(--mustard)" onclick="exportCycle()">exportar ciclo</span></p></div>'+
      '<div class="sum-grid">'+
        '<div class="sum-tile green"><div class="sum-label">Receitas</div><div class="sum-val green" style="font-size:16px">'+fmt(totInc)+'</div><div class="sum-sub">'+inc.length+' lançamentos</div></div>'+

function buildChart(){
  var cycles=lastCycles(3).reverse();
  var promises=cycles.map(function(c){
    return fetchRows(c.start,c.end).then(function(rows){
      var inc=rows.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+Number(t.amount);},0);
      var ex=rows.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+Number(t.amount);},0);
      return{lbl:c.label.split(' → ')[0],bal:inc-ex};
    });
  });
  Promise.all(promises).then(function(res){
    var slot=document.getElementById('chart-slot');if(!slot)return;
    var maxV=Math.max.apply(null,res.map(function(m){return Math.abs(m.bal);}));if(!maxV)maxV=1;
    var W=300,H=90,pad=30;
    var pts=res.map(function(m,i){var x=pad+i*((W-pad*2)/2);var y=H/2-(m.bal/maxV)*(H/2-14);return{x:x,y:y,bal:m.bal,lbl:m.lbl};});
    var path='M'+pts.map(function(p){return p.x+','+p.y;}).join(' L');
    var area='M'+pts[0].x+','+(H/2)+' L'+pts.map(function(p){return p.x+','+p.y;}).join(' L')+' L'+pts[pts.length-1].x+','+(H/2)+' Z';
    var dots=pts.map(function(p){var col=p.bal>=0?'#5a7a52':'#b85c38';return '<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="'+col+'" stroke="var(--paper)" stroke-width="2"/><text x="'+p.x+'" y="'+(H-2)+'" text-anchor="middle" font-size="10" fill="var(--ink4)" font-family="Crimson Pro,serif">'+p.lbl+'</text><text x="'+p.x+'" y="'+(p.y-10)+'" text-anchor="middle" font-size="9" fill="'+col+'" font-family="Playfair Display,serif">'+(p.bal>=0?'+':'')+fmtS(p.bal)+'</text>';}).join('');
    slot.innerHTML='<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><path d="'+area+'" fill="rgba(196,154,42,0.08)"/><line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,3"/><path d="'+path+'" fill="none" stroke="#c49a2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg></div>';
  }).catch(function(){});
}

function mkTx(t){
  var own=t.user_name===USER||t.user_name==='Conjunto'||t.created_by===USER;
  var icon=t.type==='income'?'✦':'◆';
  var recTag=t.recurring?' <span class="tag-recur">rec.</span>':'';
  var natTag='';
  if(t.nature==='conjunto') natTag=' <span class="tag-conjunto">conj.</span>';
  else if(t.nature==='Maria') natTag=' <span class="tag-maria">Maria</span>';
  else if(t.nature==='Murilo') natTag=' <span class="tag-murilo">Murilo</span>';
  var obsHtml=t.obs?'<div class="tx-obs">'+t.obs+'</div>':'';
  var payHtml=t.payment?'<div class="tx-obs" style="color:var(--moss)">'+t.payment+'</div>':'';
  var paid=isPaid(t);
  var isInc=t.type==='income';
  var statusHtml=isInc
    ?(paid?' · <span style="color:var(--moss)">recebido</span>':' · <span style="color:var(--mustard)">a receber</span>')
    :(paid?' · <span style="color:var(--moss)">pago</span>':' · <span style="color:var(--mustard)">pendente</span>');
  var paidBtn='<button class="tx-paid'+(paid?' paid':'')+'" id="paid-'+t.id+'" onclick="togglePaid(\''+t.id+'\','+paid+')" title="'+(isInc?(paid?'Marcar como a receber':'Marcar como recebido'):(paid?'Marcar como pendente':'Marcar como pago'))+'">'+(paid?'✓':'')+'</button>';
  return '<div class="tx-item" style="opacity:'+(paid?'1':'.85')+'">'
    +paidBtn
    +'<div class="tx-icon" style="color:'+(isInc?'var(--moss)':'var(--terracota)')+'">'+icon+'</div>'
    +'<div class="tx-info"><div class="tx-desc">'+t.description+recTag+'</div>'
    +'<div class="tx-meta">'+t.category+' · '+t.user_name+natTag+' · '+t.date+statusHtml+'</div>'
    +obsHtml+payHtml+'</div>'
    +'<div class="tx-amt '+t.type+'">'+(isInc?'+':'−')+fmt(t.amount)+'</div>'
    +(own?'<div class="tx-actions"><button class="tx-btn edit" onclick="openEdit(\''+t.id+'\')" title="Editar">✎</button><button class="tx-btn del" onclick="confirmDel(\''+t.id+'\',\''+t.description.replace(/'/g,'')+'\')">×</button></div>':'<div style="width:44px"></div>')
    +'</div>';
}
function isPaid(t){return t.paid===true||t.paid==='true'||t.paid===1;}
function togglePaid(id,currentPaid){
  var newPaid=!currentPaid;
  sbPatch('fin_transactions',id,{paid:newPaid}).then(function(){
    // atualiza botão localmente se existir
    var btn=document.getElementById('paid-'+id);
    if(btn){
      btn.className='tx-paid'+(newPaid?' paid':'');
      btn.textContent=newPaid?'✓':'';
      btn.title=newPaid?'Marcar como pendente':'Marcar como pago';
      btn.setAttribute('onclick','togglePaid(\''+id+'\','+newPaid+')');
      var item=btn.closest('.tx-item');
      if(item){
        item.style.opacity=newPaid?'1':'.85';
        var spans=item.querySelectorAll('.tx-meta span');
        spans.forEach(function(sp){
          if(sp.textContent==='pago'||sp.textContent==='pendente'){
            sp.textContent=newPaid?'pago':'pendente';
            sp.style.color=newPaid?'var(--moss)':'var(--mustard)';
          }
        });
      }
    } else {
      goTo(curPage());
    }
  }).catch(function(){toast('Erro ao salvar','err');});
}

function renderHist(){
  var cycles=lastCycles(12);
  var catOpts=catNames().map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
  var cycleOpts=cycles.map(function(c,i){return '<option value="'+c.start+'|'+c.end+'"'+(i===0?' selected':'')+'>'+c.label+'</option>';}).join('');
  document.getElementById('main').innerHTML=
    '<div class="page-header"><div class="orn-sm">— ✿ —</div><h2><em>Histórico</em></h2><p>Todos os lançamentos por ciclo</p></div>'+
    '<div class="card"><div class="filter-bar"><select class="fsel" id="fil-cy" onchange="filterH()">'+cycleOpts+'</select><select class="fsel" id="fil-t" onchange="filterH()"><option value="">Todos</option><option value="expense">Despesas</option><option value="income">Receitas</option></select><select class="fsel" id="fil-u" onchange="filterH()"><option value="">Todos</option><option value="Maria">Maria</option><option value="Murilo">Murilo</option></select><select class="fsel" id="fil-nat" onchange="filterH()"><option value="">Natureza</option><option value="conjunto">Conjunto</option><option value="Maria">Individual Maria</option><option value="Murilo">Individual Murilo</option></select><select class="fsel" id="fil-pay" onchange="filterH()"><option value="">Pagamento</option>'+PAYMENTS.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('')+'</select><select class="fsel" id="fil-status" onchange="filterH()"><option value="">Status</option><option value="paid">Pagos/Recebidos</option><option value="pending">Pendentes/A receber</option></select><select class="fsel" id="fil-cat" onchange="filterH()"><option value="">Categorias</option>'+catOpts+'</select></div><div id="hist-summary" style="margin-bottom:10px"></div><div id="hist-list"><div class="empty">carregando...</div></div></div>';
  filterH();
}
function filterH(){
  var cv=(document.getElementById('fil-cy')||{}).value||'';
  var parts=cv.split('|');var start=parts[0];var end=parts[1];
  var t=(document.getElementById('fil-t')||{}).value||'';
  var u=(document.getElementById('fil-u')||{}).value||'';
  var nat=(document.getElementById('fil-nat')||{}).value||'';
  var pay=(document.getElementById('fil-pay')||{}).value||'';
  var status=(document.getElementById('fil-status')||{}).value||'';
  var cat=(document.getElementById('fil-cat')||{}).value||'';
  var list=document.getElementById('hist-list');
  var sumEl=document.getElementById('hist-summary');
  if(list)list.innerHTML='<div class="empty">carregando...</div>';
  fetchRows(start,end,t,u,cat).then(function(rows){
    if(nat) rows=rows.filter(function(r){return r.nature===nat;});
    if(pay) rows=rows.filter(function(r){return r.payment===pay;});
    if(status==='paid') rows=rows.filter(function(r){return isPaid(r);});
    if(status==='pending') rows=rows.filter(function(r){return !isPaid(r);});
    if(!rows.length){if(list)list.innerHTML='<div class="empty">Nenhum lançamento encontrado neste ciclo.</div>';if(sumEl)sumEl.innerHTML='';return;}
    var totExp=rows.filter(function(x){return x.type==='expense';}).reduce(function(s,x){return s+Number(x.amount);},0);
    var totInc=rows.filter(function(x){return x.type==='income';}).reduce(function(s,x){return s+Number(x.amount);},0);
    var bal=totInc-totExp;
    var paidExpH=rows.filter(function(x){return x.type==='expense'&&isPaid(x);}).reduce(function(s,x){return s+Number(x.amount);},0);
    var paidIncH=rows.filter(function(x){return x.type==='income'&&isPaid(x);}).reduce(function(s,x){return s+Number(x.amount);},0);
    var realBalH=paidIncH-paidExpH;
    var pendExpH=totExp-paidExpH;
    var extraHtml='';
    if(u){
      var indExp=rows.filter(function(x){return x.type==='expense'&&x.nature===u;}).reduce(function(s,x){return s+Number(x.amount);},0);
      var conjExp=rows.filter(function(x){return x.type==='expense'&&x.nature==='conjunto';}).reduce(function(s,x){return s+Number(x.amount);},0);
      extraHtml='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+
        '<div class="sum-tile rose" style="flex:1;min-width:80px"><div class="sum-label">Individual</div><div class="sum-val rose" style="font-size:13px">'+fmt(indExp)+'</div></div>'+
        '<div class="sum-tile gold" style="flex:1;min-width:80px"><div class="sum-label">Conjunto</div><div class="sum-val gold" style="font-size:13px">'+fmt(conjExp)+'</div></div>'+
      '</div>';
    }
    if(sumEl)sumEl.innerHTML=
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
        '<div class="sum-tile green"><div class="sum-label">Receitas</div><div class="sum-val green" style="font-size:15px">'+fmt(totInc)+'</div></div>'+
        '<div class="sum-tile red"><div class="sum-label">Despesas</div><div class="sum-val red" style="font-size:15px">'+fmt(totExp)+'</div></div>'+
        '<div class="sum-tile '+(realBalH>=0?'green':'red')+'"><div class="sum-label">Saldo real</div><div class="sum-val '+(realBalH>=0?'green':'red')+'" style="font-size:15px">'+(realBalH>=0?'+':'')+fmt(realBalH)+'</div></div>'+
        '<div class="sum-tile gold"><div class="sum-label">Pendente</div><div class="sum-val gold" style="font-size:15px">'+fmt(pendExpH)+'</div></div>'+
      '</div>'+extraHtml;
    if(list)list.innerHTML='<div class="tx-list">'+rows.map(mkTx).join('')+'</div><div class="hist-summary"><span>'+rows.length+' lançamentos</span><span style="color:'+(bal>=0?'var(--moss)':'var(--terracota)')+'\">'+(bal>=0?'+':'')+fmt(bal)+'</span></div>';
  }).catch(function(e){if(list)list.innerHTML='<div style="color:var(--terracota);font-size:14px">Erro: '+e.message+'</div>';});
}

// ── COMPARATIVO ──
function buildComparativo(){
  var cycles=lastCycles(2);
  if(cycles.length<2)return;
  var cur=cycles[0];var prev=cycles[1];
  Promise.all([fetchRows(cur.start,cur.end),fetchRows(prev.start,prev.end)]).then(function(res){
    var curExp=res[0].filter(function(t){return t.type==='expense';});
    var prevExp=res[1].filter(function(t){return t.type==='expense';});
    var cats={};
    curExp.forEach(function(t){cats[t.category]=cats[t.category]||{cur:0,prev:0};cats[t.category].cur+=Number(t.amount);});
    prevExp.forEach(function(t){cats[t.category]=cats[t.category]||{cur:0,prev:0};cats[t.category].prev+=Number(t.amount);});
    var rows=Object.keys(cats).sort().map(function(k){
      var d=cats[k];var diff=d.cur-d.prev;
      var cls=Math.abs(diff)<1?'compare-same':diff>0?'compare-up':'compare-down';
      var arrow=Math.abs(diff)<1?'=':diff>0?'↑':'↓';
      return '<div class="compare-row"><span class="compare-cat">'+k+'</span><div class="compare-vals"><span style="color:var(--ink4)">'+fmt(d.prev)+'</span><span class="'+cls+'">'+arrow+' '+fmt(d.cur)+'</span></div></div>';
    }).join('');
    var el=document.getElementById('compare-slot');
    if(el)el.innerHTML=rows||'<div class="empty" style="padding:12px">Sem dados para comparar.</div>';
  }).catch(function(){});
}

function suggestCat(val){
  var sel=document.getElementById('f-cat');if(!sel)return;
  var lower=val.toLowerCase();
  var match=Object.keys(CAT_HINTS).find(function(k){return lower.indexOf(k)>=0;});
  if(match){
    var cat=CAT_HINTS[match];
    var exists=CATS.find(function(c){return c.name===cat;});
    if(!exists)return;
    for(var i=0;i<sel.options.length;i++){
      if(sel.options[i].value===cat){sel.selectedIndex=i;break;}
    }
  }
}

  var cycle=curCycle();
  document.getElementById('d-month').textContent='Ciclo '+cycle.label;
  document.getElementById('overlay').classList.add('show');document.getElementById('drawer').classList.add('show');
  fetchRows(cycle.start,cycle.end).then(function(all){
    var myExp=all.filter(function(t){return t.nature===USER&&t.type==='expense';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var myInc=all.filter(function(t){return t.user_name===USER&&t.type==='income';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var myBal=myInc-myExp;
    var otherExp=all.filter(function(t){return t.nature===other&&t.type==='expense';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var conjExp=all.filter(function(t){return t.nature==='conjunto'&&t.type==='expense';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var totExpIndiv=all.filter(function(t){return t.type==='expense'&&t.nature!=='conjunto';}).reduce(function(s,t){return s+Number(t.amount);},0);
    var ideal=totExpIndiv*(USER==='Maria'?CFG.m:CFG.mu)/100;var diff=myExp-ideal;
    var cnt=all.filter(function(t){return t.user_name===USER;}).length;
    var cmap={};all.filter(function(t){return t.user_name===USER&&t.type==='expense';}).forEach(function(t){cmap[t.category]=(cmap[t.category]||0)+Number(t.amount);});
    var top=Object.keys(cmap).sort(function(a,b){return cmap[b]-cmap[a];})[0];
    document.getElementById('d-body').innerHTML=
      '<div class="d-sec">Suas despesas</div>'+
      ds('Despesas '+USER,fmt(myExp),'red')+
      ds('Despesas '+other,fmt(otherExp),'red')+
      ds('Despesas conjuntas',fmt(conjExp),'gold')+
      '<div class="d-sec">Seus ganhos</div>'+
      ds('Receitas',fmt(myInc),'green')+
      ds('Saldo',(myBal>=0?'+':'')+fmt(myBal),myBal>=0?'green':'red')+
      '<div class="d-sec">Divisão</div>'+
      ds('Vs. divisão',Math.abs(diff)<0.5?'equilibrado':(diff>0?'pagou +':'pagou −')+fmt(Math.abs(diff)),Math.abs(diff)<0.5?'gold':diff>0?'red':'green')+
      ds('Lançamentos',cnt+' neste ciclo','gold')+
      (top?ds('Maior categoria',top,'gold'):'')+
      ds('Dias restantes',cycle.daysLeft+' dias','gold')+
      '<div class="d-sec">Trocar usuário</div>'+
      '<div class="switch-btn" onclick="switchUser(\''+other+'\')"><div class="sw-av '+other.toLowerCase()+'">'+(other==='Maria'?'M':'Mu')+'</div><div style="flex:1"><div class="sw-name">'+other+'</div><div class="sw-hint">Entrar como '+other+'</div></div><span style="color:var(--ink4)">→</span></div>';
  }).catch(function(){document.getElementById('d-body').innerHTML='<div style="padding:8px;color:var(--terracota);font-size:14px">Erro ao carregar.</div>';});
}
function closeDrawer(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
function ds(lbl,val,cls){return '<div class="dstat"><span class="dstat-lbl">'+lbl+'</span><span class="dstat-val '+cls+'">'+val+'</span></div>';}
function switchUser(name){closeDrawer();USER=name;setTopbar(name);toast('Bem-vind'+(name==='Maria'?'a':'o')+', '+name+'!','ok');goTo('dashboard');}

document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ── AUTH ──
function login(name){
  USER=name;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  setTopbar(name);
  loadCFG().then(function(){goTo('dashboard');}).catch(function(){goTo('dashboard');});
}
function logout(){
  closeDrawer();USER=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}
function setTopbar(name){var av=document.getElementById('t-av');av.textContent=name==='Maria'?'M':'Mu';av.className='t-av '+name.toLowerCase();document.getElementById('t-name').textContent=name;}

// ── EXPORTAR CSV ──
function exportCycle(){
  var cycle=curCycle();
  fetchRows(cycle.start,cycle.end).then(function(all){
    if(!all.length){toast('Nenhum dado para exportar','err');return;}
    var lines=['Data,Descrição,Categoria,Tipo,Natureza,Pagamento,Valor,Pago por,Pago,Recorrente,Observação'];
    all.forEach(function(t){
      lines.push([
        t.date,
        '"'+(t.description||'').replace(/"/g,'""')+'"',
        t.category||'',
        t.type==='expense'?'Despesa':'Receita',
        t.nature||'conjunto',
        t.payment||'',
        Number(t.amount).toFixed(2).replace('.',','),
        t.user_name||'',
        isPaid(t)?'Sim':'Não',
        t.recurring?'Sim':'Não',
        '"'+(t.obs||'').replace(/"/g,'""')+'"'
      ].join(','));
    });
    var csv=lines.join('\n');
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='caderneta_'+cycle.start+'_'+cycle.end+'.csv';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    toast('CSV exportado!','ok');
  }).catch(function(){toast('Erro ao exportar','err');});
}
</script>
